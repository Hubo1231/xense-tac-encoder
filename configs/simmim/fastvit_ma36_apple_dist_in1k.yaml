# Pre-train a tactile-image SimMIM with a timm FastViT-MA36 encoder.
# Run:
#   python scripts/train_with_timm.py --config configs/simmim/fastvit_ma36_apple_dist_in1k.yaml

# Training task
task: simmim

# Dataset
data_dir: pngs
eval_ratio: 0.2

# Model
# Requested HF model id: timm/fastvit_ma36.apple_dist_in1k
# timm registered model name: fastvit_ma36.apple_dist_in1k
# timm pretrained_cfg:
#   input_size: (3, 256, 256)
#   num_features: 1216
#   model(x) embedding output with num_classes=0: (B, 1216)
model: fastvit_ma36.apple_dist_in1k
pretrained: true
pretrained_path: "checkpoint/fastvit_ma36_apple_dist_in1k/model.safetensors"
reparameterize: true
initial_checkpoint: ""
resume: ""
no_resume_opt: false
in_chans: 3
latent_dim: 256
decoder_hidden_channels: 512
decoder_hidden_spatial:
model_kwargs: {}

# Loss
# 重建项完全使用 mix loss = α(1-MS_SSIM) + (1-α)L1，关掉 MSE/grad。
w_mse: 0.0
w_grad: 0.0
w_kld: 0.01
w_ssim: 0.0
w_mix: 1.0
mix_alpha: 0.84
use_ms_ssim: true

# Device
device: auto

# Optimizer
opt: adamw
lr: 0.0001
weight_decay: 0.01
clip_grad:

# Scheduler
sched: cosine
epochs: 100
warmup_epochs: 1
warmup_lr: 0.000001
min_lr: 0.000001
cooldown_epochs: 0

# Preprocessing is resolved from timm pretrained_cfg in scripts/train_with_timm.py.

# Loader and logging
batch_size: 64
workers: 4
seed: 42
log_interval: 20
val_interval: 1
output: outputs
experiment: ""

# wandb
log_wandb: true
wandb_project: xense-tac-encoder
wandb_name: "fastvit_ma36_apple_dist_in1k"
wandb_log_images: true
wandb_image_interval: 1
wandb_num_images: 8
