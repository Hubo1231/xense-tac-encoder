# FastViT-T12 + SimMIM 预训练权重的 probe 评测配置。
# 结构/划分/预处理与 fastvit_t12_physical_collection2.yaml 完全一致，
# 仅 pretrained_path 换成 SimMIM 训练得到的 encoder 权重
# （backbone-only 评测：--checkpoint none，multitask pooler/头保持随机初始化）。
#
# 运行：
#   .venv/bin/python scripts/evaluate_force_probe.py \
#     --config configs/multitask/fastvit_t12_simmim_collection2.yaml \
#     --checkpoint none \
#     --force-config configs/multitask/force_probe.yaml \
#     --output-dir outputs/force_probe_eval/fastvit_t12_simmim

task: multitask

# Dataset
dataset_type: h5
data_dir: data/xensim/outputs/collection2
h5_dir: data/xensim/outputs/collection2
stats_path: data/xensim/outputs/collection2/stats.json
normalize_targets: true
image_key: rgb
eval_ratio: 0.2

# Model
model_arch: physical
model: fastvit_t12.apple_dist_in1k
pretrained: true
# SimMIM 训练的 encoder 权重；原始文件 checkpoint/trained_params.safetensors 为
# Flax 命名格式，timm 无法直接加载，已用 scripts/convert_fastvit_flax_safetensors.py
# 转换为 timm state_dict 格式。
pretrained_path: "checkpoint/fastvit_t12_simmim_timm.safetensors"
initial_checkpoint: ""
resume: ""
no_resume_opt: false
in_chans: 3
model_kwargs: {}

# Heads：本配置只用于 probe 评测（--checkpoint none），heads/loss_weights 仅为
# 满足模型构建与配置校验，不参与任何训练。
heads:
  depth:
    type: regression
    dim: 1
    weight: 1.0
    loss: mse
    spatial: true
    shape: [175, 100]
  flow:
    type: regression
    dim: 2
    weight: 1.0
    loss: mse
    spatial: true
    shape: [175, 100, 2]

loss_weights:
  dense_depth: 1.0
  dense_flow: 1.0
  bottleneck_depth: 0.25
  bottleneck_flow: 0.25

# Device
device: auto

# Optimizer
opt: adamw
lr: 0.0001
weight_decay: 0.01
clip_grad:

# Scheduler
sched: cosine
epochs: 100
warmup_epochs: 1
warmup_lr: 0.000001
min_lr: 0.000001
cooldown_epochs: 0

# Preprocessing is resolved from timm pretrained_cfg in scripts/train_multitask.py.

# Loader and logging
batch_size: 16
workers: 4
seed: 42
log_interval: 20
log_batches: false
val_interval: 1
output: outputs
experiment: ""

# wandb
log_wandb: false
wandb_project: xense-tac-encoder
wandb_name: "fastvit_t12_simmim_collection2"
