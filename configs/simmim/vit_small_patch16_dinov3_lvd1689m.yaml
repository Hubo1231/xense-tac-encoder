# Pre-train a tactile-image SimMIM with a timm DINOv3 ViT-S encoder.
# Run:
#   python scripts/train_with_timm.py --config configs/simmim/vit_small_patch16_dinov3_lvd1689m.yaml

# Training task
task: simmim

# Dataset
data_dir: pngs
eval_ratio: 0.2

# Model
# Requested HF model id: timm/vit_small_patch16_dinov3.lvd1689m
# timm registered model name: vit_small_patch16_dinov3.lvd1689m
# timm pretrained_cfg:
#   input_size: (3, 256, 256)
#   num_features: 384
#   model(x) embedding output with num_classes=0: (B, 384)
model: vit_small_patch16_dinov3.lvd1689m
pretrained: true
pretrained_path: "checkpoint/vit_small_patch16_dinov3_lvd1689m/model.safetensors"
initial_checkpoint: ""
resume: ""
no_resume_opt: false
in_chans: 3
model_kwargs: {}

# SimMIM 超参（仅 task: simmim 生效；缺省见 train_with_timm.py 的 SIMMIM_DEFAULTS）
simmim:
  mask_patch_size: 32
  mask_ratio: 0.6

# Device
device: auto

# Optimizer
opt: adamw
lr: 0.0001
weight_decay: 0.01
clip_grad:

# Scheduler
sched: cosine
epochs: 100
warmup_epochs: 1
warmup_lr: 0.000001
min_lr: 0.000001
cooldown_epochs: 0

# Preprocessing is resolved from timm pretrained_cfg in scripts/train_with_timm.py.

# Loader and logging
batch_size: 64
workers: 4
seed: 42
log_interval: 20
val_interval: 1
output: outputs
experiment: ""

# wandb
log_wandb: true
wandb_project: xense-tac-encoder
wandb_name: "vit_small_patch16_dinov3_lvd1689m_simmim"
wandb_log_images: true
wandb_image_interval: 1
wandb_num_images: 8
