# Pre-train a tactile-image MAE with a timm CLIP ViT-B/16 encoder.
# Run:
#   ./scripts/run_all_mae.sh vit_base_patch16_clip_224_mae
#   # or: python scripts/train_with_timm.py --config configs/mae/vit_base_patch16_clip_224_mae.yaml

# Training task
task: mae

# Model
# timm CLIP ViT-B/16：input_size (3, 224, 224)，patch16 -> 14x14=196 patch tokens，num_prefix_tokens=1（cls）。
# 预训练权重用 timm 的 CLIP tag（首次会从 HF Hub 下载）。可选 tag：
#   .openai                 OpenAI 原版 CLIP（默认，最常用）
#   .laion2b                LAION-2B CLIP（标准 GELU，与本模型激活更匹配）
#   .laion2b_ft_in12k_in1k  LAION + ImageNet 微调
# 若离线：把 pretrained_path 指向本地 safetensors，pretrained 仍设 true。
model: vit_base_patch16_clip_224.openai
pretrained: true
pretrained_path: ""
initial_checkpoint: ""
resume: ""
no_resume_opt: false
in_chans: 3
model_kwargs: {}

# MAE 超参（仅 task: mae 生效；缺省见 train_with_timm.py 的 MAE_DEFAULTS）
mae:
  mask_ratio: 0.75
  decoder_embed_dim: 512
  decoder_depth: 4
  decoder_num_heads: 16
  norm_pix_loss: true

# Dataset
data_dir: pngs
eval_ratio: 0.2

# Device
device: auto

# Optimizer
opt: adamw
lr: 0.0001
weight_decay: 0.05
clip_grad:

# Scheduler
sched: cosine
epochs: 100
warmup_epochs: 10
warmup_lr: 0.000001
min_lr: 0.000001
cooldown_epochs: 0

# Preprocessing is resolved from timm pretrained_cfg in scripts/train_with_timm.py
# (CLIP 的 mean/std 会自动取自 pretrained_cfg)。

# Loader and logging
batch_size: 64
workers: 4
seed: 42
log_interval: 20
val_interval: 1
output: outputs
experiment: ""

# wandb
log_wandb: true
wandb_project: xense-tac-encoder
wandb_name: "vit_base_patch16_clip_224_mae"
wandb_log_images: true
wandb_image_interval: 1
wandb_num_images: 8
