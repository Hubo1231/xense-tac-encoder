seed: 42

model:
  name: tactile_vae
  params:
    backbone_name: resnet18
    latent_dim: 256
    pretrained: false
    decoder_hidden_channels: 512

loss:
  name: tactile_vae
  params:
    mse: 1.0
    grad: 2.0
    kld: 0.01
    ssim: 0.0

data:
  name: tactile_images
  image_size: 224
  train:
    root:
    length: 256
  eval:
    root:
    length: 128

dataloader:
  train:
    batch_size: 32
    shuffle: true
    num_workers: 4
    drop_last: true
  eval:
    batch_size: 16
    shuffle: false
    num_workers: 4
    drop_last: false

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01

training:
  device: auto
  epochs: 20
  log_every: 20
  output: runs/vae_resnet18.pt

evaluation:
  device: auto
  checkpoint: runs/vae_resnet18.pt
  max_batches: 0
  measure_latency_only_encoder: true
  output_json: runs/vae_resnet18_eval.json
