# Train a tactile-image VAE with a timm DINOv3 ViT encoder.
# Run:
#   python scripts/train_with_timm.py

# Dataset
data_dir: data
eval_ratio: 0.2

# Model
# Requested HF model id: timm/vit_base_patch16_dinov3.lvd1689m
# timm registered model name: vit_base_patch16_dinov3.lvd1689m
# timm pretrained_cfg:
#   input_size: (3, 256, 256)
#   num_features: 768
#   forward_features output without features_only: (B, 261, 768)
#   features_only output[-1]: (B, 768, 16, 16)
#
# Note: features_only uses timm's official feature getter to return spatial
# feature maps instead of token sequences; the training wrapper takes the last
# feature map.
model: vit_base_patch16_dinov3.lvd1689m
pretrained: true
features_only: true
pretrained_path: "checkpoint/vit_base_patch16_dinov3_lvd1689m/model.safetensors"
initial_checkpoint: ""
resume: ""
no_resume_opt: false
in_chans: 3
latent_dim: 256
decoder_hidden_channels: 512
decoder_hidden_spatial:
model_kwargs: {}

# Loss
w_mse: 1.0
w_grad: 2.0
w_kld: 0.01
w_ssim: 0.0

# Device
device: auto

# Optimizer
opt: adamw
lr: 0.0001
weight_decay: 0.01
clip_grad:

# Scheduler
sched: cosine
epochs: 20
warmup_epochs: 1
warmup_lr: 0.000001
min_lr: 0.000001
cooldown_epochs: 0

# Preprocessing is resolved from timm pretrained_cfg in scripts/train_with_timm.py.

# Loader and logging
batch_size: 8
workers: 4
seed: 42
log_interval: 20
val_interval: 1
output: outputs
experiment: ""

# wandb
log_wandb: true
wandb_project: xense-tac-encoder
wandb_name: "vit_base_patch16_dinov3_lvd1689m"
wandb_log_images: true
wandb_image_interval: 1
wandb_num_images: 8
