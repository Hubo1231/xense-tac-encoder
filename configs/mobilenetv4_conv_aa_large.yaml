# Train a tactile-image VAE with a timm MobileNetV4 encoder.
# Run:
#   python scripts/train_with_timm.py

# Dataset
data_dir: data
eval_ratio: 0.2

# Model
model: mobilenetv4_conv_aa_large
pretrained: false
features_only: false
pretrained_path: "checkpoint/mobilenetv4_conv_aa_large_e230_r448_in12k_ft_in1k/model.safetensors"
initial_checkpoint: ""
resume: ""
no_resume_opt: false
in_chans: 3
#input_size: [3, 256, 256]
latent_dim: 256
decoder_hidden_channels: 512
decoder_hidden_spatial:
model_kwargs: {}

# Loss
# 重建项完全使用 mix loss = α(1-MS_SSIM) + (1-α)L1，关掉 MSE/grad。
w_mse: 0.0
w_grad: 0.0
w_kld: 0.01
w_ssim: 0.0
w_mix: 1.0
mix_alpha: 0.84
use_ms_ssim: true

# Device
device: auto

# Optimizer
opt: adamw
lr: 0.0001
weight_decay: 0.01
clip_grad:

# Scheduler
sched: cosine
epochs: 20
warmup_epochs: 1
warmup_lr: 0.000001
min_lr: 0.000001
cooldown_epochs: 0

# Preprocessing is resolved from timm pretrained_cfg in scripts/train_with_timm.py.

# Loader and logging
batch_size: 200
workers: 4
seed: 42
log_interval: 20
val_interval: 1
output: outputs
experiment: ""

# wandb
log_wandb: true
wandb_project: xense-tac-encoder
wandb_name: "mobilenetv4_conv_aa_large"
wandb_log_images: true
wandb_image_interval: 1
wandb_num_images: 8
