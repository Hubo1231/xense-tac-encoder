# 多头监督（multitask）预训练：timm DINOv3 ViT encoder + collection2 HDF5。
#
# 与 configs/multitask/fastvit_t12_physical_collection2.yaml 使用同一份
# data/xensim/outputs/collection2 数据；仿照 FastViT 的 physical 双分支，
# DINOv3 使用 ViT patch token + AttentionPool：patch 分支监督 175×100，
# z 分支监督 16×16。
#
# 运行：
#   uv run python scripts/train_multitask.py \
#     --config configs/multitask/vit_base_patch16_dinov3_lvd1689m.yaml

task: multitask

# Dataset
dataset_type: h5
data_dir: data/xensim/outputs/collection2
h5_dir: data/xensim/outputs/collection2
stats_path: data/xensim/outputs/collection2/stats.json
normalize_targets: true
image_key: rgb
eval_ratio: 0.2

# Model
# DINOv3 物理双分支：patch decoder + attention-pool z 分支。
model_arch: dinov3_physical
model: vit_base_patch16_dinov3.lvd1689m
pretrained: false
pretrained_path: ""
initial_checkpoint: ""
resume: ""
no_resume_opt: false
in_chans: 3
model_kwargs: {}

# Heads：depth/flow 直接对应 collection2 HDF5 里的空间回归目标。
# spatial: true 表示保留 (175,100) 网格，不展平成向量。
heads:
  depth:
    type: regression
    dim: 1
    weight: 1.0
    loss: mse
    spatial: true
    shape: [175, 100]
  flow:
    type: regression
    dim: 2
    weight: 1.0
    loss: mse
    spatial: true
    shape: [175, 100, 2]

# todo.md 中 DINOv3 的多监督权重。
loss_weights:
  patch_depth: 0.25
  patch_flow: 0.25
  bottleneck_depth: 1.0
  bottleneck_flow: 1.0

# Device
device: auto

# Optimizer
opt: adamw
lr: 0.0001
weight_decay: 0.01
clip_grad:

# Scheduler
sched: cosine
epochs: 100
warmup_epochs: 1
warmup_lr: 0.000001
min_lr: 0.000001
cooldown_epochs: 0

# Preprocessing is resolved from timm pretrained_cfg in scripts/train_multitask.py.

# Loader and logging
batch_size: 16
workers: 4
seed: 42
log_interval: 20
log_batches: false
val_interval: 1
output: outputs
experiment: ""

# wandb
log_wandb: false
wandb_project: xense-tac-encoder
wandb_name: "vit_base_patch16_dinov3_lvd1689m_collection2"
